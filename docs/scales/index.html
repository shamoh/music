<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f4f8" />
  <meta name="description" content="Hudební stupnice (nejen pro Alt Saxofon)" />
  <title>Scales</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/apply-saved-profile-vars.js"></script>
</head>
<body>
  <header id="site-header"></header>

  <main>
    <!-- Filter + scale selector -->
    <section class="filter-bar" aria-label="Výběr stupnice">

      <div class="filter-group scale-select-group">
        <select id="scale-select" aria-label="Výběr stupnice"></select>
      </div>

    </section>

    <!-- Sticky heading: ‹ previous | current | next › (scale-nav.js) and the filters -->
    <section class="scale-nav-bar scale-nav-row filters-pending" aria-label="Předchozí a další stupnice">
      <div id="scale-heading" class="scale-heading">
        <span id="scale-nav-prev" class="scale-nav-item scale-nav-prev"></span>
        <span class="scale-nav-sep scale-nav-sep-first" aria-hidden="true"></span>
        <h2 id="scale-nav-title" class="scale-nav-current"></h2>
        <span class="scale-nav-sep" aria-hidden="true"></span>
        <span id="scale-nav-next" class="scale-nav-item scale-nav-next"></span>
      </div>
      <!-- Dur / Moll and sharp / flat filters: at hand while browsing the scales;
           on narrow screens hidden behind the toggle (scale-nav.js) -->
      <button type="button" class="scale-nav-filters-toggle" aria-expanded="false" aria-controls="scale-nav-filters">Filtry <span class="scale-nav-filters-arrow" aria-hidden="true">▾</span></button>
      <div id="scale-nav-filters" class="scale-nav-filters">
        <div class="filter-group" role="group" aria-label="Typ stupnice">
          <button class="filter-chip active" data-filter-type="major" aria-pressed="true">Dur</button>
          <button class="filter-chip active" data-filter-type="minor" aria-pressed="true">Moll</button>
        </div>
        <div class="filter-group" role="group" aria-label="Předznamenání">
          <button class="filter-chip active" data-filter-acc="sharp" aria-pressed="true">♯ Kříže</button>
          <button class="filter-chip active" data-filter-acc="flat"  aria-pressed="true">♭ Béčka</button>
        </div>
        <button type="button" class="scale-nav-filters-reset" hidden>Vše zapnout</button>
      </div>
    </section>

    <!-- Major view (single scale) -->
    <section class="scale-section" id="major-view" hidden>
      <div class="title-row">
        <div class="title-info">
          <h2 id="major-title"></h2>
          <span id="major-chord" class="chord-inline"></span>
        </div>
        <a id="major-range-link" class="range-link" href="/scales/instrument/saxophone/alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
      </div>
      <div id="major-note-row" class="note-row" aria-label="Noty stupnice"></div>
      <div id="major-staff" class="staff-container" aria-live="polite"></div>
    </section>

    <!-- Minor view (3 variants) -->
    <section class="scale-section" id="minor-view" hidden>

      <div class="minor-variant" id="minor-natural">
        <div class="title-row">
          <div class="title-info">
            <h3></h3>
            <span id="minor-chord" class="chord-inline"></span>
          </div>
          <a class="range-link" data-range-type="natural" href="/scales/instrument/saxophone/alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
        </div>
        <div class="note-row"></div>
        <div class="staff-container" aria-live="polite"></div>
      </div>

      <div class="minor-variant" id="minor-harmonic">
        <div class="title-row">
          <h3></h3>
          <a class="range-link" data-range-type="harmonic" href="/scales/instrument/saxophone/alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
        </div>
        <div class="note-row"></div>
        <div class="staff-container" aria-live="polite"></div>
      </div>

      <div class="minor-variant" id="minor-melodic">
        <div class="title-row">
          <h3></h3>
          <a class="range-link" data-range-type="melodic" href="/scales/instrument/saxophone/alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
        </div>
        <div class="note-row"></div>
        <div class="staff-container" aria-live="polite"></div>
        <p class="variant-changes">Sestupně se hraje jako aiolská moll.</p>
      </div>
    </section>

  </main>

  <!-- Swipe hint (touch devices only) and keyboard shortcuts (hidden on touch devices) -->
  <p class="touch-hint">Tahem prstem doleva / doprava přepnete na další / předchozí stupnici.</p>
  <p class="key-hint">
    <span><kbd>Shift</kbd> + <kbd>←</kbd> <kbd>→</kbd> předchozí / další stupnice</span>
    <span><kbd>Esc</kbd> zruší zvýraznění tónu</span>
  </p>
  <footer class="app-footer" id="app-footer"></footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
