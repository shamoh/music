<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f4f8" />
  <meta name="description" content="Hudební stupnice (nejen pro Alt Saxofon)" />
  <title>Scales</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    // Apply saved visual profile before first paint to prevent flash
    try {
      const vars = JSON.parse(localStorage.getItem('scales-profile-vars') || 'null');
      if (vars) {
        const r = document.documentElement;
        for (const [k, v] of Object.entries(vars)) r.style.setProperty(k, v);
      }
    } catch (_) {}
  </script>
</head>
<body>
  <header>
    <h1>
      <a href="/" class="bc-logo">
        <svg class="logo" viewBox="0 0 85 50" aria-hidden="true">
          <!-- Staff Lines -->
          <path d="M 6 14 Q 45 9, 80 14" stroke="var(--logo-staff, #8a8aa0)" stroke-width="1" fill="none" opacity="0.5" />
          <path d="M 6 19 Q 45 14, 80 19" stroke="var(--logo-staff, #8a8aa0)" stroke-width="1" fill="none" opacity="0.5" />
          <path d="M 6 24 Q 45 19, 80 24" stroke="var(--logo-staff, #8a8aa0)" stroke-width="1" fill="none" opacity="0.5" />
          <path d="M 6 29 Q 45 24, 80 29" stroke="var(--logo-staff, #8a8aa0)" stroke-width="1" fill="none" opacity="0.5" />
          <path d="M 6 34 Q 45 29, 80 34" stroke="var(--logo-staff, #8a8aa0)" stroke-width="1" fill="none" opacity="0.5" />
          <!-- Treble Clef -->
          <path d="M 16.05 43.5 L 19.95 4 C 19.95 1, 23.85 0, 25.8 3 C 27.75 6, 26.45 11, 18.65 17 C 10.85 23, 7.6 29.5, 11.5 34.5 C 15.4 39.5, 24.5 39.5, 27.75 33.5 C 30.35 28, 23.85 22.5, 18.65 26.5 C 16.05 28.5, 16.7 31.5, 20.6 31" stroke="var(--logo-clef, #3d2e1e)" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="16.05" cy="43.5" r="2.8" fill="var(--logo-clef, #3d2e1e)" />
          <!-- Notes -->
          <ellipse cx="38" cy="30" rx="5.6" ry="3.8" transform="rotate(-20 38 30)" fill="var(--logo-tonic, #8a1530)" />
          <line x1="43.2" y1="30" x2="43.2" y2="13" stroke="var(--logo-tonic, #8a1530)" stroke-width="2.2" stroke-linecap="round" />
          <ellipse cx="53" cy="24" rx="5.6" ry="3.8" transform="rotate(-20 53 24)" fill="var(--logo-chord, #1a1a2e)" />
          <line x1="58.2" y1="24" x2="58.2" y2="7" stroke="var(--logo-chord, #1a1a2e)" stroke-width="2.2" stroke-linecap="round" />
          <polygon points="43.2,13 58.2,7 58.2,11 43.2,17" fill="var(--logo-chord, #1a1a2e)" />
          <ellipse cx="68" cy="18" rx="5.6" ry="3.8" transform="rotate(-20 68 18)" fill="var(--logo-accent, #2f4a36)" />
          <line x1="62.8" y1="18" x2="62.8" y2="35" stroke="var(--logo-accent, #2f4a36)" stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </a>
      <a href="/" class="bc-link">Hudební nauka</a>
      <span class="bc-sep" aria-hidden="true">|</span>
      <span class="nav-current">Stupnice</span>
      <span class="bc-sep" aria-hidden="true">|</span>
      <a href="/metronome/" class="bc-link">Metronom</a>
    </h1>
    <div class="settings">
      <button type="button" id="settings-toggle" class="settings-toggle" aria-label="Nastavení" aria-expanded="false" aria-controls="settings-panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2.4h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.88a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.22.08.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <div id="settings-panel" class="settings-panel" hidden>
        <label class="settings-row">Vzhled
          <select id="profile-select" class="profile-select"></select>
        </label>
        <a class="settings-link" href="/history.html">Historie verzí</a>
      </div>
    </div>
  </header>

  <main>
    <!-- Filter + scale selector -->
    <section class="filter-bar" aria-label="Výběr stupnice">

      <div class="filter-group">
        <span class="filter-label">Typ</span>
        <button class="filter-chip active" data-filter-type="major" aria-pressed="true">Dur</button>
        <button class="filter-chip active" data-filter-type="minor" aria-pressed="true">Moll</button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Klíč</span>
        <button class="filter-chip active" data-filter-acc="sharp" aria-pressed="true">♯ Kříže</button>
        <button class="filter-chip active" data-filter-acc="flat"  aria-pressed="true">♭ Béčka</button>
      </div>

      <div class="filter-group scale-select-group">
        <select id="scale-select" aria-label="Výběr stupnice"></select>
      </div>

    </section>

    <!-- Major view (single scale) -->
    <section class="scale-section" id="major-view" hidden>
      <div class="title-row">
        <div class="title-info">
          <h2 id="major-title"></h2>
          <span id="major-chord" class="chord-inline"></span>
        </div>
        <a id="major-range-link" class="range-link" href="/scales/instrument/saxophone-alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
      </div>
      <div id="major-note-row" class="note-row" aria-label="Noty stupnice"></div>
      <div id="major-staff" class="staff-container" aria-live="polite"></div>
    </section>

    <!-- Minor view (3 variants) -->
    <section class="scale-section" id="minor-view" hidden>

      <div class="minor-variant" id="minor-natural">
        <div class="title-row">
          <div class="title-info">
            <h3></h3>
            <span id="minor-chord" class="chord-inline"></span>
          </div>
          <a class="range-link" data-range-type="natural" href="/scales/instrument/saxophone-alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
        </div>
        <div class="note-row"></div>
        <div class="staff-container" aria-live="polite"></div>
      </div>

      <div class="minor-variant" id="minor-harmonic">
        <div class="title-row">
          <h3></h3>
          <a class="range-link" data-range-type="harmonic" href="/scales/instrument/saxophone-alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
        </div>
        <div class="note-row"></div>
        <div class="staff-container" aria-live="polite"></div>
      </div>

      <div class="minor-variant" id="minor-melodic">
        <div class="title-row">
          <h3></h3>
          <a class="range-link" data-range-type="melodic" href="/scales/instrument/saxophone-alto/" aria-label="Rozsah Alt Saxofonu">🎷 Rozsah</a>
        </div>
        <div class="note-row"></div>
        <div class="staff-container" aria-live="polite"></div>
        <p class="variant-changes">Sestupně se hraje jako aiolská moll.</p>
      </div>
    </section>

  </main>

  <footer class="app-footer" id="app-footer"></footer>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
